<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Element Screenshot</title>
  </head>
  <body>
    <h1>Element Screenshot</h1>

    <div class="field">
      <label for="parentSelector">親セレクタ</label>
      <input id="parentSelector" type="text" spellcheck="false" placeholder=".preview-container" />
    </div>

    <div class="field">
      <label for="childSelector">子セレクタ</label>
      <input
        id="childSelector"
        type="text"
        spellcheck="false"
        placeholder=".message-preview-detail-container"
      />
    </div>

    <label class="check">
      <input id="directChild" type="checkbox" />
      <span>直下の子要素のみ（&gt;）</span>
    </label>

    <label class="check">
      <input id="includeHidden" type="checkbox" checked />
      <span>非表示の要素も撮影する</span>
    </label>

    <div class="selector-preview">
      <span class="selector-preview__label">実際のセレクタ</span>
      <code id="resolvedSelector">-</code>
    </div>

    <div id="result" class="result result--idle">セレクタを入力してください</div>

    <details>
      <summary>詳細オプション</summary>
      <div class="options-body">
        <div class="field field--inline">
          <label for="prefix">ファイル名</label>
          <input id="prefix" type="text" spellcheck="false" placeholder="element" />
        </div>
        <div class="field field--inline">
          <label for="folder">保存先</label>
          <input id="folder" type="text" spellcheck="false" placeholder="element-screenshot" />
        </div>
        <div class="field field--inline">
          <label for="scale">解像度</label>
          <select id="scale">
            <option value="0">画面と同じ（自動）</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
          </select>
        </div>
        <div class="field field--inline">
          <label for="quality">JPEG品質</label>
          <select id="quality">
            <option value="1">最高（100%）</option>
            <option value="0.92">高（92%）</option>
            <option value="0.8">中（80%）</option>
            <option value="0.6">低（60%）</option>
          </select>
        </div>
        <label class="check">
          <input id="transparent" type="checkbox" />
          <span>背景を透過する（PNG で保存）</span>
        </label>
        <label class="check">
          <input id="inlineImages" type="checkbox" />
          <span>別ドメインの画像も取り込む（要権限）</span>
        </label>
        <label class="check">
          <input id="scrollIntoView" type="checkbox" checked />
          <span>撮影前に要素までスクロール（遅延読み込み対策）</span>
        </label>
      </div>
    </details>

    <div class="actions">
      <button id="recountBtn" class="btn btn--ghost" type="button">再カウント</button>
      <button id="highlightBtn" class="btn btn--ghost" type="button">ハイライト</button>
      <button id="saveBtn" class="btn btn--primary" type="button" disabled>保存</button>
    </div>

    <div id="progress" class="progress" hidden>
      <div class="progress__bar"><div id="progressFill" class="progress__fill"></div></div>
      <div id="progressText" class="progress__text"></div>
    </div>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
