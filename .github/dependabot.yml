# Dependabot によるバージョン更新の設定
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # npm の依存（vite / typescript / sass / @types / html2canvas）
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    # 1 件ずつ PR が立つと数が多いのでまとめる
    groups:
      production:
        dependency-type: 'production'
      development:
        dependency-type: 'development'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'
      include: 'scope'

  # GitHub Actions（actions/checkout や deploy-pages などのバージョン）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
